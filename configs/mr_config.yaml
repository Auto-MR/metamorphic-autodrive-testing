# Metamorphic Relations Configuration
# Tolerances use statistical threshold: ε = fraction × steering_range (2.0)
# Default fraction = 0.05 → ε = 0.10

mrs:
  # ── Category A: Invariance MRs ──────────────────────────────────────────
  # Formula: |f(x) - f(T(x))| < ε
  brightness_steering:
    category: A
    tolerance: 0.10
    transform: brightness

  contrast_steering:
    category: A
    tolerance: 0.10
    transform: contrast

  noise_robustness_steering:
    category: A
    tolerance: 0.12
    transform: noise

  weather_robustness:
    category: A
    tolerance: 0.20
    transform: fog

  occlusion_robustness:
    category: A
    tolerance: 0.18
    transform: noise

  # ── Category B: Symmetry MRs ─────────────────────────────────────────────
  # Formula: f(flip(x)) ≈ -f(x)
  flip_symmetry_steering:
    category: B
    tolerance: 0.10
    transform: flip

  straight_road_stability:
    category: B
    tolerance: 0.05
    transform: brightness

  perspective_scaling:
    category: B
    tolerance: 0.12
    transform: scale

  # ── Category C: Temporal MRs ─────────────────────────────────────────────
  # Formula: |f(x_t) - f(x_{t+1})| < δ
  temporal_smoothness:
    category: C
    tolerance: 0.08
    transform: translate

  constant_curvature_consistency:
    category: C
    tolerance: 0.05
    transform: translate

  small_lane_shift_invariance:
    category: C
    tolerance: 0.15
    transform: translate

  # ── Category D: Composition MRs ──────────────────────────────────────────
  # Apply multiple transforms simultaneously
  composed_brightness_noise:
    category: D
    tolerance: 0.15
    transform: composed_bright_noise

  composed_weather_blur:
    category: D
    tolerance: 0.22
    transform: composed_weather_blur

  lane_center_shift_consistency:
    category: D
    tolerance: 0.25
    transform: composed_shift_bright
